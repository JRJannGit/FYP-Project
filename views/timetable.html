<div class="timetable-container">
  <!-- Top Navigation & Controls Bar -->
  <div class="timetable-header">
    <div class="week-selector">
      <button class="icon-btn" id="prev-week"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="current-week">Week 3</span>
      <button class="icon-btn" id="next-week"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="view-toggle">
      <button class="toggle-btn active">Week</button>
      <button class="toggle-btn">Month</button>
    </div>
  </div>

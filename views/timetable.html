<div class="timetable-container">
  <div id="timetable-upload-view" class="timetable-card">
    <div class="timetable-section upload-section">
      <div id="btn-upload-timetable" class="action-box upload-box">
        <div class="icon-wrapper">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <span class="action-title">Upload Timetable</span>
        <small class="action-desc">Upload Image / PDF File</small>
        <input type="file" id="timetable-file-input" accept="image/*,.pdf" style="display: none;">
      </div>
    </div>

    <div class="section-divider"></div>

    <div class="timetable-section web-section">
      <a href="https://uptm.edupage.org/timetable/" target="_blank" rel="noopener" class="action-box web-box">
        <div class="icon-wrapper">
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </div>
        <span class="action-title">Web Timetable</span>
        <small class="action-desc">Website Timetable</small>
      </a>
    </div>
  </div>

  <div id="timetable-display-view" class="timetable-card display-card" style="display: none;">
    <div class="timetable-preview-wrapper">
      <img id="timetable-img-preview" src="" alt="Uploaded Timetable" style="display: none;">
      <iframe id="timetable-pdf-preview" src="" style="display: none;"></iframe>
    </div>

    <button id="btn-delete-timetable" class="delete-icon-btn" title="Delete Timetable">
      <i class="fa-regular fa-trash-can"></i>
    </button>
  </div>

  <div id="delete-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-icon">
        <i class="fa-regular fa-trash-can"></i>
      </div>
      <h3>Delete Timetable</h3>
      <p>Are you sure you want to delete this timetable?</p>
      <div class="modal-actions">
        <button id="btn-confirm-delete" class="btn-modal btn-yes">YES</button>
        <button id="btn-cancel-delete" class="btn-modal btn-no">NO</button>
      </div>
    </div>
  </div>
</div>

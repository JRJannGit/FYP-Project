<div class="resources-container">

  <div class="resources-header">
    <div class="header-info">
      <h3>University Resources</h3>
      <p>Customs your url-links</p>
    </div>
    <button class="add-resource-btn" id="btn-add-resource">
      <i class="fa-solid fa-link"></i> Add url-link
    </button>
  </div>

  <div class="resources-grid" id="resources-grid">
  </div>
</div>

<div class="modal-overlay" id="resource-modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="resource-modal-title">Add Resource</h3>
      <button class="modal-close" id="resource-modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form id="resource-form" class="modal-form">
      <input type="hidden" id="resource-id">

      <div class="form-group">
        <label for="resource-title">Topic</label>
        <input type="text" id="resource-title" required placeholder="e.g. UCAM Portal" maxlength="100">
      </div>

      <div class="form-group">
        <label for="resource-caption">Caption / Description</label>
        <textarea id="resource-caption" rows="2" placeholder="e.g. Access subject registration"></textarea>
      </div>

      <div class="form-group">
        <label for="resource-url">Url-link</label>
        <input type="url" id="resource-url" required placeholder="https://">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="resource-modal-cancel">Cancel</button>
        <button type="submit" class="btn-save" id="resource-modal-save">Add</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="delete-resource-modal" style="display:none;z-index:10000;">
  <div class="modal-box modal-box--small">
    <div class="modal-header">
      <h3>Delete Resource?</h3>
      <button class="modal-close" id="delete-resource-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <p class="modal-text" id="delete-resource-name">This resource will be permanently deleted.</p>
    <div class="modal-actions modal-actions--center">
      <button type="button" class="btn-danger" id="delete-resource-yes">DELETE</button>
      <button type="button" class="btn-cancel" id="delete-resource-no">CANCEL</button>
    </div>
  </div>
</div>

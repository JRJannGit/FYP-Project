<div class="lecturer-assignments-container">

  <div class="lecturer-assignments-grid">

    <!-- LEFT COLUMN: Editor + Received -->
    <div class="left-stack">

      <div class="lecturer-card editor-card">
        <label class="card-label">TOPIC</label>

        <input type="text"
               class="lecturer-topic-input"
               id="topic-input"
               placeholder="e.g. Database Systems Assignment 1"
               maxlength="150">

        <div class="editor-divider"></div>

        <div class="lecturer-toolbar">
          <button type="button" class="tool-btn" data-cmd="bold" title="Bold"><i class="fa-solid fa-bold"></i></button>
          <button type="button" class="tool-btn" data-cmd="italic" title="Italic"><i class="fa-solid fa-italic"></i></button>
          <button type="button" class="tool-btn" data-cmd="underline" title="Underline"><i class="fa-solid fa-underline"></i></button>
          <div class="divider"></div>
          <button type="button" class="tool-btn" data-cmd="insertUnorderedList" title="Bullet"><i class="fa-solid fa-list-ul"></i></button>
          <button type="button" class="tool-btn" data-cmd="insertOrderedList" title="Numbered"><i class="fa-solid fa-list-ol"></i></button>
        </div>

        <div class="lecturer-desc-input"
             id="desc-input"
             contenteditable="false"
             data-placeholder="Text..."></div>

        <div class="editor-actions">
          <button type="button" class="btn-secondary" id="btn-edit-toggle">
            <i class="fa-solid fa-pen"></i> Edit
          </button>
        </div>
      </div>

      <div class="lecturer-card received-card">
        <h3>Assignments Received</h3>
        <button type="button" class="btn-view" id="btn-view-submissions">
          <i class="fa-solid fa-eye"></i> View
        </button>
      </div>

    </div>

    <!-- RIGHT COLUMN: Meta -->
    <div class="lecturer-card meta-card">

      <div class="upload-row">
        <button type="button" class="upload-btn" id="btn-upload-file">
          <div class="upload-icon"><i class="fa-solid fa-file-arrow-up"></i></div>
          <span>Upload File</span>
        </button>

        <button type="button" class="upload-btn" id="btn-insert-url">
          <div class="upload-icon"><i class="fa-solid fa-link"></i></div>
          <span>Insert url-link</span>
        </button>
      </div>

      <input type="file" id="assignment-file-input" hidden>

      <div class="upload-preview" id="upload-preview" style="display:none;">
        <div class="preview-info">
          <i class="fa-solid fa-paperclip"></i>
          <span id="preview-name">filename</span>
        </div>
        <button type="button" class="preview-remove" id="preview-remove">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="meta-row">
        <div class="meta-field">
          <input type="date" id="meta-date" class="meta-input">
        </div>
        <div class="meta-field">
          <input type="date" id="meta-due-date" class="meta-input">
        </div>
      </div>

      <div class="meta-row">
        <div class="meta-field">
          <input type="time" id="meta-start-time" class="meta-input" value="09:00">
        </div>
        <div class="meta-field">
          <input type="time" id="meta-end-time" class="meta-input" value="17:00">
        </div>
      </div>

      <div class="meta-field meta-field--full">
        <label>Assign to Class</label>
        <select id="meta-class" class="meta-input">
          <option value="">Loading classes...</option>
        </select>
      </div>

      <div class="meta-actions">
        <button type="button" class="btn-release" id="btn-release">
          <i class="fa-solid fa-paper-plane"></i> Release
        </button>
        <button type="button" class="btn-reset" id="btn-reset">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>

    </div>

  </div>

</div>

<!-- =========================================
     MODAL: Insert URL
     ========================================= -->
<div class="modal-overlay" id="url-input-modal" style="display:none;">
  <div class="modal-box modal-box--small">
    <div class="modal-header">
      <h3><i class="fa-solid fa-link"></i> Insert URL</h3>
      <button type="button" class="modal-close" id="url-input-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-form">
      <div class="form-group">
        <label>URL Link</label>
        <input type="url" id="url-input-field" class="meta-input" placeholder="https://example.com">
      </div>
      <div class="url-error" id="url-error" style="display:none;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="url-input-cancel">Cancel</button>
        <button type="button" class="btn-save" id="url-input-save">Insert</button>
      </div>
    </div>
  </div>
</div>

<!-- =========================================
     MODAL: Submissions
     ========================================= -->
<div class="modal-overlay" id="submissions-modal" style="display:none;">
  <div class="submissions-modal">

    <div class="submissions-header">
      <div class="submissions-header-title">
        <i class="fa-solid fa-inbox"></i>
        <span>Submissions</span>
      </div>
      <div class="submissions-header-actions">
        <button type="button" class="btn-download-all" id="btn-download-all">
          <i class="fa-solid fa-download"></i> Download All
        </button>
        <button type="button" class="modal-close" id="submissions-close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="submissions-table-header">
      <div>Student Email</div>
      <div>Time</div>
      <div style="text-align:right;">Action</div>
    </div>

    <div class="submissions-list" id="submissions-list"></div>

    <div class="submissions-footer">
      <button type="button" class="btn-cancel" id="submissions-close-btn">Close</button>
    </div>

  </div>
</div>

<!-- =========================================
     MODAL: Pick Assignment
     ========================================= -->
<div class="modal-overlay" id="pick-assignment-modal" style="display:none;">
  <div class="modal-box modal-box--small">
    <div class="modal-header">
      <h3>Select Assignment</h3>
      <button type="button" class="modal-close" id="pick-assignment-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="pick-list" id="pick-assignment-list"></div>
  </div>
</div>

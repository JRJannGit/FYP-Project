<div class="profile-container">

  <!-- ===================== AUTH SECTION (Login / Signup) ===================== -->
  <div id="auth-section" class="auth-card" style="display:none;">
    <div class="auth-tabs">
      <button id="tab-login-btn" type="button" class="tab-btn active">Login</button>
      <button id="tab-signup-btn" type="button" class="tab-btn inactive">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label class="form-label">Student ID</label>
        <input type="text" id="login-student-id" class="form-input" placeholder="e.g. AM1234567890" required>
      </div>
      <div class="form-group last">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <!-- SIGN UP -->
    <form id="signup-form" class="auth-form" style="display:none;">
      <div class="form-group">
        <label class="form-label">Student ID</label>
        <input type="text" id="signup-student-id" class="form-input" placeholder="e.g. AM1234567890" required>
      </div>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="signup-full-name" class="form-input" placeholder="Junior Jann Jacqim" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="signup-email" class="form-input" placeholder="student@uptm.edu.my" required>
      </div>
      <div class="form-group last">
        <label class="form-label">Password</label>
        <input type="password" id="signup-password" class="form-input" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Create Account</button>
    </form>
  </div>

  <!-- ===================== PROFILE SECTION (Logged In) ===================== -->
  <div id="profile-section" class="profile-card" style="display:none;">

    <div class="profile-avatar">
      <i class="fa-solid fa-user"></i>
    </div>

    <h2 id="profile-name" class="profile-name">User Name</h2>
    <p id="profile-id" class="profile-id">User ID</p>

    <div class="profile-details">
      <div class="profile-detail-item">
        <strong>Email:</strong>
        <span id="profile-email">-</span>
      </div>
      <div class="profile-detail-item">
        <strong>Status:</strong>
        <span class="status-badge">
          <i class="fa-solid fa-circle" style="font-size:6px;"></i> Active
        </span>
      </div>
    </div>

    <button id="btn-logout" type="button" class="btn-logout">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
    </button>
  </div>

</div>

<!-- =========================================
     LOGOUT CONFIRM MODAL
     ========================================= -->
<div class="modal-overlay" id="logout-modal" style="display:none;z-index:10000;">
  <div class="modal-box modal-box--small">
    <div class="modal-header">
      <h3>Log Out?</h3>
    </div>
    <p class="modal-text">You will be returned to the login page.</p>
    <div class="modal-actions--center">
      <button type="button" class="btn-danger" id="logout-yes">YES</button>
      <button type="button" class="btn-cancel" id="logout-no">NO</button>
    </div>
  </div>
</div>

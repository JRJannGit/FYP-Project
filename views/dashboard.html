<div class="dashboard-container">

  <!-- Header -->
  <div class="dashboard-header">
    <div class="greeting-box">
      <h1>Hey, <span id="user-greeting-name">Guest</span>! 👋</h1>
      <p id="buddy-speech-text">Loading information...</p>
    </div>
    <div class="quote-card">
      <i class="fa-solid fa-quote-left quote-icon"></i>
      <p class="quote-text">"Loading quote..."</p>
      <div class="time-badge">
        <i class="fa-regular fa-clock"></i> <span id="current-date-text">Loading...</span>
      </div>
    </div>
  </div>

  <!-- Grid -->
  <div class="dashboard-grid">

    <!-- Left Column -->
    <div class="grid-column left-col">

      <div class="mascot-card">
        <canvas class="buddy-rive buddy-rive--dashboard" width="360" height="450"></canvas>
      </div>

      <div class="card quick-access-card">
        <h3>Quick Access</h3>
        <div class="portal-grid">
          <a href="https://ucam.uptm.edu.my" target="_blank" rel="noopener" class="portal-btn ucam">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>UCAM</span>
          </a>
          <a href="https://www.openlearning.com" target="_blank" rel="noopener" class="portal-btn openlearning">
            <i class="fa-solid fa-book-open"></i>
            <span>Open Learning</span>
          </a>
          <a href="https://mail.google.com" target="_blank" rel="noopener" class="portal-btn email">
            <i class="fa-solid fa-envelope"></i>
            <span>Email</span>
          </a>
          <a href="https://www.uptm.edu.my/" target="_blank" rel="noopener" class="portal-btn UPTM">
            <i class="fa-solid fa-globe"></i>
            <span>UPTM Portal</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="grid-column right-col">

      <div class="card schedule-card">
        <div class="card-header">
          <h3>Today's Schedule</h3>
          <button class="btn-view-all" data-modal="schedule">View All</button>
        </div>
        <ul class="schedule-list" id="today-schedule-list">
          <!-- rendered by JS -->
        </ul>
      </div>

      <div class="card tasks-card">
        <div class="card-header">
          <h3>Upcoming Task</h3>
          <button class="btn-view-all" data-modal="tasks">View All</button>
        </div>
        <ul class="task-list" id="upcoming-tasks-list">
          <!-- rendered by JS -->
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- =========================================
     MODAL: Today's Schedule (full)
     ========================================= -->
<div class="modal-overlay dash-modal-overlay" id="schedule-modal" style="display:none;">
  <div class="dash-modal">
    <div class="dash-modal__header">
      <h3><i class="fa-solid fa-calendar-day"></i> Today's Schedule</h3>
      <p>Full class list for today</p>
    </div>
    <div class="dash-modal__content" id="schedule-modal-content">
      <!-- rendered by JS -->
    </div>
    <div class="dash-modal__footer">
      <button class="btn-close-modal" id="schedule-modal-close-btn">Close</button>
    </div>
  </div>
</div>

<!-- =========================================
     MODAL: Upcoming Tasks (full)
     ========================================= -->
<div class="modal-overlay dash-modal-overlay" id="tasks-modal" style="display:none;">
  <div class="dash-modal">
    <div class="dash-modal__header">
      <h3><i class="fa-solid fa-list-check"></i> Upcoming Tasks</h3>
      <p>Assignments, reminders and events</p>
    </div>
    <div class="dash-modal__content" id="tasks-modal-content">
      <!-- rendered by JS -->
    </div>
    <div class="dash-modal__footer">
      <button class="btn-close-modal" id="tasks-modal-close-btn">Close</button>
    </div>
  </div>
</div>

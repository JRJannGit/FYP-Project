<div class="assignments-container">
  <div class="assignments-header">
    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="all">All</button>
      <button class="tab-btn" data-filter="upcoming">Upcoming</button>
      <button class="tab-btn" data-filter="completed">Completed</button>
    </div>
    <button class="add-task-btn" id="open-add-modal">
      <i class="fa-solid fa-plus"></i> Add New
    </button>
  </div>

  <div class="task-cards-list" id="assignments-list">
  </div>

  <div class="empty-state" id="assignments-empty" style="display:none;">
    <i class="fa-regular fa-folder-open"></i>
    <h4>No assignments yet</h4>
    <p>Click "Add New" to create your first assignment.</p>
  </div>
</div>

<div class="modal-overlay" id="assignment-modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="assignment-modal-title">Add Assignment</h3>
      <button class="modal-close" id="assignment-modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form id="assignment-form" class="modal-form">
      <input type="hidden" id="assignment-id">

      <div class="form-group">
        <label for="assignment-subject">Subject / Title</label>
        <input type="text" id="assignment-subject" required placeholder="e.g. Database Assignment">
      </div>

      <div class="form-group">
        <label for="assignment-desc">Description</label>
        <textarea id="assignment-desc" rows="3" placeholder="e.g. Submission of ERD and Report"></textarea>
      </div>

      <div class="form-group">
        <label for="assignment-due">Due Date</label>
        <input type="date" id="assignment-due" required>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="assignment-exam">
        <label for="assignment-exam">Mark as exam</label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="assignment-modal-cancel">Cancel</button>
        <button type="submit" class="btn-save" id="assignment-modal-save">Save</button>
      </div>
    </form>
  </div>

  <!-- ================= SUBMIT ASSIGNMENT MODAL ================= -->
<div class="modal-overlay" id="submit-modal" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h3><i class="fa-solid fa-upload"></i> Submit Assignment</h3>
      <button class="modal-close" id="submit-modal-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form id="submit-form" class="modal-body">
      <p style="margin-bottom:14px;color:var(--text-muted);font-size:0.85rem;">
        Submitting for: <strong id="submit-target-title">—</strong>
      </p>

      <div class="form-group">
        <label>Choose File (max 10MB)</label>
        <input type="file" id="submit-file-input" required>
        <small id="submit-file-name" style="display:block;margin-top:6px;color:var(--text-muted);font-size:0.75rem;">
          No file chosen
        </small>
      </div>
    </form>

    <div class="modal-footer">
      <button class="action-btn secondary" id="submit-modal-cancel">Cancel</button>
      <button class="action-btn primary" id="submit-modal-save" form="submit-form" type="submit">
        Submit
      </button>
    </div>
  </div>
</div>
</div>

<div class="calendar-container">

  <!-- Top Bar -->
  <div class="calendar-topbar">
    <button class="btn-add-event" id="btn-add-event">
      <i class="fa-solid fa-plus"></i> Add Event
    </button>

    <div class="switch-calendar">
      <span class="switch-label">Switch Calendar</span>
      <label class="switch">
        <input type="checkbox" id="toggle-calendar-mode">
        <span class="slider round"></span>
      </label>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="calendar-layout">

    <!-- Left: Events List -->
    <div class="events-panel">
      <h3 class="events-panel-title" id="events-month-title">Events</h3>
      <div class="events-list" id="events-list">
        <!-- rendered by JS -->
      </div>
    </div>

    <!-- Right: Monthly grid OR Academic calendar image -->
    <div class="calendar-view">

      <!-- Monthly Grid -->
      <div class="monthly-view" id="monthly-view">
        <div class="month-header">
          <button class="month-nav" id="prev-month"><i class="fa-solid fa-chevron-left"></i></button>
          <h3 id="current-month-year">—</h3>
          <button class="month-nav" id="next-month"><i class="fa-solid fa-chevron-right"></i></button>
        </div>

        <div class="weekday-row">
          <span>Mon</span><span>Tue</span><span>Wed</span>
          <span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>

        <div class="days-grid" id="calendar-days">
          <!-- rendered by JS -->
        </div>
      </div>

      <!-- Academic Calendar View -->
      <div class="academic-view" id="academic-view" style="display:none;">
        <div class="academic-header">
          <h3>UPTM Academic Calendar</h3>
        </div>
        <div class="academic-image-wrapper" id="academic-image-wrapper">
          <div class="academic-placeholder">
            <i class="fa-regular fa-image"></i>
            <p>No academic calendar uploaded yet.</p>
            <small>Admin will upload it soon.</small>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- =========================================
     ADD EVENT MODAL
     ========================================= -->
<div class="modal-overlay" id="event-modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="event-modal-title">Add Event</h3>
      <button class="modal-close" id="event-modal-close"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <form id="event-form" class="modal-form">
      <input type="hidden" id="event-id">

      <div class="form-group">
        <label for="event-topic">Topic</label>
        <input type="text" id="event-topic" required placeholder="e.g. Cisco Learning">
      </div>

      <div class="form-group">
        <label for="event-date">Date</label>
        <input type="date" id="event-date" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Start Time</label>
          <div class="time-input-group">
            <input type="time" id="event-start-time" value="09:00" required>
          </div>
        </div>
        <div class="form-group">
          <label>End Time</label>
          <div class="time-input-group">
            <input type="time" id="event-end-time" value="10:00" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="event-color">Color</label>
        <select id="event-color">
          <option value="blue">Blue</option>
          <option value="red">Red</option>
          <option value="yellow">Yellow</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="event-modal-cancel">Cancel</button>
        <button type="submit" class="btn-save" id="event-modal-save">Add</button>
      </div>
    </form>
  </div>
</div>

<!-- =========================================
     DELETE CONFIRM MODAL
     ========================================= -->
<div class="modal-overlay" id="delete-event-modal" style="display:none;">
  <div class="modal-box modal-box--small">
    <div class="modal-header">
      <h3>Delete Event?</h3>
      <button class="modal-close" id="delete-event-close"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <p class="modal-text" id="delete-event-name">Are you sure you want to delete this event?</p>

    <div class="modal-actions modal-actions--center">
      <button type="button" class="btn-danger" id="delete-event-yes">YES</button>
      <button type="button" class="btn-cancel" id="delete-event-no">NO</button>
    </div>
  </div>
</div>

<div class="dashboard-container">

  <div class="dashboard-header">
    <div class="greeting-box">
      <h1>Hey, <span id="user-greeting-name">Admin</span>! 👋</h1>
      <p id="buddy-speech-text">Loading information...</p>
    </div>
    <div class="quote-card">
      <i class="fa-solid fa-quote-left quote-icon"></i>
      <p class="quote-text">"Loading quote..."</p>
      <div class="time-badge">
        <i class="fa-regular fa-clock"></i> <span id="current-date-text">Loading...</span>
      </div>
    </div>
  </div>

  <div class="dashboard-grid">

    <div class="grid-column left-col">
      <div class="mascot-card">
        <canvas class="buddy-rive buddy-rive--dashboard" width="360" height="450"></canvas>
      </div>

      <div class="card quick-access-card">
        <div class="card-header" style="margin-bottom:15px;">
          <h3>Quick Access</h3>
          <button class="icon-btn-sm" id="btn-edit-quick-access" title="Edit Quick Access">
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>
        <div class="portal-grid" id="admin-portal-grid">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>

    <div class="grid-column right-col">
      <div class="card schedule-card">
        <div class="card-header">
          <h3>Today's Schedule</h3>
          <button class="btn-view-all" data-modal="schedule">View All</button>
        </div>
        <ul class="schedule-list" id="today-schedule-list"></ul>
      </div>

      <div class="card tasks-card">
        <div class="card-header">
          <h3>Upcoming Task</h3>
          <button class="btn-view-all" data-modal="tasks">View All</button>
        </div>
        <ul class="task-list" id="upcoming-tasks-list"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Edit Quick Access -->
<div class="modal-overlay" id="qa-modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="qa-modal-title">Edit Resource</h3>
      <button class="modal-close" id="qa-modal-close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="qa-form" class="modal-form">
      <input type="hidden" id="qa-id">
      <div class="form-group">
        <label for="qa-topic">Topic</label>
        <input type="text" id="qa-topic" required placeholder="e.g. UCAM Portal" maxlength="100">
      </div>
      <div class="form-group">
        <label for="qa-url">Url-link</label>
        <input type="url" id="qa-url" required placeholder="https://">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="qa-cancel">Cancel</button>
        <button type="submit" class="btn-save" id="qa-save">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Schedule + Tasks (reuse dashboard modals) -->
<div class="modal-overlay dash-modal-overlay" id="schedule-modal" style="display:none;">
  <div class="dash-modal">
    <div class="dash-modal__header">
      <h3><i class="fa-solid fa-calendar-day"></i> Today's Schedule</h3>
      <p>Full class list for today</p>
    </div>
    <div class="dash-modal__content" id="schedule-modal-content"></div>
    <div class="dash-modal__footer">
      <button class="btn-close-modal" id="schedule-modal-close-btn">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay dash-modal-overlay" id="tasks-modal" style="display:none;">
  <div class="dash-modal">
    <div class="dash-modal__header">
      <h3><i class="fa-solid fa-list-check"></i> Upcoming Tasks</h3>
      <p>Assignments, reminders and events</p>
    </div>
    <div class="dash-modal__content" id="tasks-modal-content"></div>
    <div class="dash-modal__footer">
      <button class="btn-close-modal" id="tasks-modal-close-btn">Close</button>
    </div>
  </div>
</div>

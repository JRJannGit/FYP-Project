<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/@rive-app/canvas@2.21.6"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, system-ui, sans-serif; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .toast {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, #1a2236 0%, #151c2e 100%);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 16px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 18px;
      animation: slideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .toast::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
    }

    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    .toast__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-left: 6px;
    }

    .toast__brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .toast__brand i { color: #f59e0b; font-size: 0.85rem; }

    .toast__close {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all 0.15s;
      -webkit-app-region: no-drag;
    }

    .toast__close:hover {
      color: #ffffff;
      background-color: rgba(239, 68, 68, 0.15);
    }

    .toast__body {
      display: flex;
      gap: 14px;
      padding-left: 6px;
      margin-bottom: 16px;
    }

    .toast__mascot {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast__mascot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    .toast__content { flex: 1; min-width: 0; }

    .toast__badge {
      display: inline-block;
      font-size: 0.65rem;
      background-color: rgba(239, 68, 68, 0.18);
      color: #f87171;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .toast__title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .toast__desc {
      font-size: 0.78rem;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .toast__time {
      font-size: 0.72rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .toast__time i { font-size: 0.65rem; }

    .toast__footer {
      display: flex;
      gap: 8px;
      padding-left: 6px;
      -webkit-app-region: no-drag;
    }

    .toast__btn {
      flex: 1;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .toast__btn--primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.35);
    }
    .toast__btn--primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(59, 130, 246, 0.5);
    }

    .toast__btn--secondary {
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .toast__btn--secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="toast">
    <div class="toast__header">
      <div class="toast__brand">
        <i class="fa-solid fa-bell"></i>
        <span>UPTM Buddy · Reminder</span>
      </div>
      <button class="toast__close" id="close-btn">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="toast__body">
      <div class="toast__mascot">
        <canvas class="buddy-rive buddy-rive--toast" width="70" height="90"></canvas>
      </div>
      <div class="toast__content">
        <div class="toast__badge" id="badge">Reminder</div>
        <div class="toast__title" id="title">—</div>
        <div class="toast__desc" id="desc">—</div>
        <div class="toast__time">
          <i class="fa-regular fa-clock"></i>
          <span id="time">—</span>
        </div>
      </div>
    </div>

    <div class="toast__footer">
      <button class="toast__btn toast__btn--primary" id="view-btn">
        <i class="fa-solid fa-arrow-right"></i> View Now
      </button>
      <button class="toast__btn toast__btn--secondary" id="dismiss-btn">
        <i class="fa-solid fa-check"></i> Dismiss
      </button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('reminder-data', (event, data) => {
      document.getElementById('title').innerText = data.title || 'Reminder';
      document.getElementById('desc').innerText  = data.description || '';
      document.getElementById('time').innerText  = data.time || '';
      document.getElementById('badge').innerText = (data.priority || 'reminder').toUpperCase();
    });

    document.getElementById('dismiss-btn').addEventListener('click', () => {
      ipcRenderer.send('dismiss-notification');
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      ipcRenderer.send('dismiss-notification');
    });

    document.getElementById('view-btn').addEventListener('click', () => {
      ipcRenderer.send('view-reminder');
    });
  </script>
  <script src="src/rive-buddy.js"></script>

</body>
</html>

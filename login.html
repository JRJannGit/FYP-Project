<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPTM Buddy — Log In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>

  <div class="login-bg"></div>

  <div class="login-wrapper">

    <div class="login-brand">
        <img src="assets/login-logo.png" alt="UPTM Buddy" class="brand-logo-img">
        <p>Your campus companion</p>
    </div>

    <div class="login-card">

      <div class="role-tabs">
        <button class="role-tab active" data-role="student">
          <i class="fa-solid fa-user-graduate"></i> Student
        </button>
        <button class="role-tab" data-role="lecturer">
          <i class="fa-solid fa-chalkboard-user"></i> Lecturer
        </button>
        <button class="role-tab" data-role="admin">
          <i class="fa-solid fa-user-shield"></i> Admin
        </button>
      </div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label id="login-label">Student ID</label>
          <div class="input-wrap">
            <i class="fa-solid fa-id-card" id="login-icon"></i>
            <input
              type="text"
              id="login-identifier"
              placeholder="e.g. AM1234567890"
              required
              autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="login-password"
              placeholder="Enter your password"
              required>
            <button type="button" class="toggle-pw" id="toggle-pw">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In
        </button>

        <div class="signup-hint" id="signup-hint">
          <span>Don't have an account?</span>
          <button type="button" class="link-btn" id="btn-goto-signup">Sign Up</button>
        </div>
      </form>

      <form id="signup-form" class="login-form" style="display:none;">
        <div class="form-group">
          <label>Student ID</label>
          <div class="input-wrap">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="su-student-id" placeholder="e.g. AM1234567890" required>
          </div>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="su-full-name" placeholder="Your full name" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="su-email" placeholder="e.g. AM24124017652@student.uptm.edu.my" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="su-password" placeholder="Min 6 characters" required>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-signup">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>

        <div class="signup-hint">
          <span>Already have an account?</span>
          <button type="button" class="link-btn" id="btn-goto-login">Log In</button>
        </div>
      </form>

      <div class="login-error" id="login-error" style="display:none;"></div>
    </div>

    <div class="login-footer">
      <p>© 2026 UPTM Buddy · FYP Project</p>
    </div>
    <div class="dev-shortcuts">
        <button data-dev-role="student" data-dev-id="AM1234567890" data-dev-pw="test123">
          Dev: Student
        </button>
        <button data-dev-role="lecturer" data-dev-id="ahmad@uptm.edu.my" data-dev-pw="lecturer123">
          Dev: Lecturer
        </button>
        <button data-dev-role="admin" data-dev-id="ADMIN001" data-dev-pw="admin123">
          Dev: Admin
        </button>
      </div>

  </div>

  <link rel="stylesheet" href="styles/notices.css">
  <script src="src/notices.js"></script>
  <script src="src/auth.js"></script>
  <script src="src/api.js"></script>
  <script src="src/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UPTM Buddy — Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f17;
      color: #f8fafc;
    }
    .placeholder {
      text-align: center;
      max-width: 400px;
      padding: 40px;
    }
    .placeholder i {
      font-size: 4rem;
      color: #f59e0b;
      margin-bottom: 20px;
    }
    .placeholder h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    .placeholder p {
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .placeholder button {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="placeholder">
    <i class="fa-solid fa-user-shield"></i>
    <h1>Admin Panel</h1>
    <p>Coming soon. This view is under construction.</p>
    <button onclick="localStorage.removeItem('uptm_session'); window.location.href='login.html';">
      <i class="fa-solid fa-arrow-left"></i> Log Out
    </button>
  </div>
</body>
</html>
